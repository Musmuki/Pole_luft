name: Refresh Cloudflare Pages

# The site lives only on Cloudflare Pages (pole-luft.pages.dev), which builds on every push itself.
# New DWD/UBA data needs a rebuild without a push: this job calls the Cloudflare deploy hook every 2 hours
# (Cloudflare Pages Free allows 500 builds/month; every 2 h is ~360).

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "::error::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK is missing; the site is not refreshed."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 -X POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
          echo "Cloudflare rebuild triggered."
