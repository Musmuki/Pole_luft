name: Build and deploy

on:
  schedule:
    - cron: "17 * * * *"   # hourly; UBA air data is hourly
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pages
        env:
          SITE_URL: https://musmuki.github.io/Pole_luft
          BASE_PATH: /Pole_luft
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Cloudflare Pages Free build allowance is limited; trigger scheduled deploys every 2 hours.
      - name: Trigger Cloudflare Pages rebuild (optional)
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "No Cloudflare Pages hook configured; GitHub Pages remains active."
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ] && [ "$((10#$(date -u +%H) % 2))" -ne 0 ]; then
            echo "Skipped odd-hour rebuild to stay under Cloudflare Pages free build quota."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 -X POST "$CLOUDFLARE_DEPLOY_HOOK"
