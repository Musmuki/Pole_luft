name: Build and deploy

on:
  schedule:
    - cron: "17 * * * *"   # hourly; UBA air data is hourly
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create pollen-luft --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=pollen-luft --branch=main
