name: Refresh Cloudflare Pages

# Cloudflare builds the site from GitHub. Rebuild every two hours to refresh DWD/UBA data.
# Prefer the optional Cloudflare deploy hook; without it, push a harmless timestamp
# to main so Cloudflare's Git integration triggers a fresh build.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 20 -X POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
            echo "Cloudflare deploy hook accepted."
          else
            echo "No deploy hook configured; triggering rebuild via Git push."
            echo "USE_GIT_FALLBACK=true" >> "$GITHUB_ENV"
          fi
      - name: Checkout repository for fallback
        if: env.USE_GIT_FALLBACK == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Trigger Cloudflare Git-integrated build
        if: env.USE_GIT_FALLBACK == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .cloudflare-refresh
          git add .cloudflare-refresh
          git commit -m "chore: refresh air and pollen data [skip ci]"
          git push origin HEAD:main
          echo "Pushed refresh marker; Cloudflare Git integration should rebuild."
